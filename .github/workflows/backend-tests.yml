name: Backend Tests

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'backend/**'
  push:
    branches: [ main ]
    paths:
      - 'backend/**'

permissions:
  contents: read
  pull-requests: write

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'
          cache-dependency-path: backend/go.sum

      - name: Install dependencies
        run: go mod download

      - name: Build
        run: go build ./...

      - name: Run tests with coverage
        run: |
          go test -coverprofile=coverage.out -covermode=atomic ./... 2>&1 | tee test-output.txt
          echo "TEST_EXIT_CODE=${PIPESTATUS[0]}" >> "$GITHUB_ENV"

      - name: Generate coverage report
        if: always()
        shell: bash
        run: |
          total=$(go tool cover -func=coverage.out | grep '^total:' | awk '{print $NF}')

          {
            echo "## Backend Test Coverage"
            echo ""
            echo "| Package | Coverage | Status |"
            echo "|---------|----------|--------|"

            while IFS= read -r line; do
              result=$(echo "$line" | awk '{print $1}')
              pkg=$(echo "$line" | awk '{print $2}' | sed 's|brew-detective-backend/||')
              cov=$(echo "$line" | sed -n 's/.*coverage: \([0-9.]*%\).*/\1/p')
              if [ -z "$cov" ]; then cov="0.0%"; fi
              if [ "$result" = "ok" ]; then
                echo "| ${pkg} | ${cov} | :white_check_mark: |"
              else
                echo "| ${pkg} | ${cov} | :x: |"
              fi
            done < <(grep -E '^ok|^FAIL' test-output.txt)

            echo "| **Total** | **${total}** | |"
            echo ""
            echo "<details>"
            echo "<summary>Per-function coverage</summary>"
            echo ""
            echo '```'
            go tool cover -func=coverage.out
            echo '```'
            echo "</details>"
          } > coverage-report.md

      - name: Post coverage comment on PR
        if: github.event_name == 'pull_request'
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          path: backend/coverage-report.md

      - name: Print coverage summary
        if: always()
        run: cat coverage-report.md

      - name: Fail if tests failed
        if: always()
        run: exit "$TEST_EXIT_CODE"
